# Font
font_family      family="Cascadia Code" style="Regular"
bold_font        family="Cascadia Code" style="Bold"
italic_font      family="Cascadia Code" style="Italic"
bold_italic_font family="Cascadia Code" style="Bold Italic"
font_size        10.7

text_composition_strategy legacy
modify_font cell_height 1px

# Cursor
cursor_shape block
cursor_blink_interval 0

# Behaviour
confirm_os_window_close 0
enable_audio_bell no
shell_integration enabled no-cursor

# New OS window in the current working directory (works inside nvim too)
map ctrl+shift+enter new_os_window_with_cwd

# Catppuccin Mocha
foreground              #cdd6f4
background              #1e1e2e
