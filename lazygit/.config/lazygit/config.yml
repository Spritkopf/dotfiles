gui:
  sidePanelWidth: 0.2 # gives you more space to show things side-by-side
  switchTabsWithPanelJumpKeys: true
  nerdFontsVersion: "3"
  showDivergenceFromBaseBranch: 'onlyArrow'
  theme:
    activeBorderColor: ["#fab387", "bold"]
    inactiveBorderColor: ["#89b4fa"]
    searchingActiveBorderColor: ["#fab387", "bold"]
    optionsTextColor: ["#89b4fa"]
    selectedLineBgColor: ["#45475a"]
    defaultFgColor: ["#cdd6f4"]
    unstagedChangesColor: ["#f38ba8"]
    cherryPickedCommitFgColor: ["#89b4fa"]
    cherryPickedCommitBgColor: ["#f2cdcd"]
git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --side-by-side --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
customCommands:
  - key: 'u'
    command: 'git submodule update -- {{.SelectedFile.Name}}'
    context: 'files'
    description: 'Update submodule'
